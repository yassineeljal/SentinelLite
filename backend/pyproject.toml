[project]
name = "sentinel-core"
version = "0.1.0"
description = "SentinelLite core: ingestion API and detection/response workers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "maxminddb>=3.2.0",
    "pydantic-settings>=2.15.0",
    "pyotp>=2.10.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
sentinel = "sentinel_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Real log lines are pasted verbatim: wrapping them would hide what the parser really sees.
"tests/normalizers/test_linux_admin.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Test-only libraries without type information (they build the tiny GeoIP fixture databases).
module = ["mmdb_writer", "netaddr"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs real Redis/Postgres (SENTINEL_TEST_REDIS_URL, SENTINEL_TEST_DATABASE_URL)"]

[dependency-groups]
dev = [
    "mmdb-writer>=0.2.7",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
