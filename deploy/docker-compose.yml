name: sentinellite

x-app-build: &app-build
  context: ..
  dockerfile: deploy/Dockerfile

x-database-url: &database-url
  SENTINEL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot job: applies database migrations, then exits. The API waits for it.
  migrate:
    build: *app-build
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Consumes events.raw, normalizes, writes events / dead letters. Scale with
  # `docker compose up -d --scale normalizer=N` (consumer group: each entry goes to one worker).
  normalizer:
    build: *app-build
    command: ["python", "-m", "sentinel_core.workers.normalizer"]
    environment:
      <<: *database-url
      SENTINEL_REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Consumes events.normalized, applies the detection rules, writes alerts. The rules are
  # read once at startup (bad rules => the worker refuses to start): edit `rules/`, then
  # `docker compose restart detector`.
  detector:
    build: *app-build
    command: ["python", "-m", "sentinel_core.workers.detector"]
    environment:
      <<: *database-url
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_RULES_DIR: /app/rules
      # When true, new alerts are announced on `alerts.new` for the enricher (profile below).
      SENTINEL_ENRICHMENT_ENABLED: ${SENTINEL_ENRICHMENT_ENABLED:-false}
      # When true, every new alert is also announced on `alerts.respond` for the responder profile.
      SENTINEL_RESPONDER_ENABLED: ${SENTINEL_RESPONDER_ENABLED:-false}
      # Only read if an ENABLED rule needs GeoIP (`type: stateful`, e.g. ssh-impossible-travel,
      # shipped disabled): most deployments never touch this. Same files as the enricher's.
      SENTINEL_GEOIP_CITY_DB: /geoip/dbip-city-lite.mmdb
      SENTINEL_GEOIP_ASN_DB: /geoip/dbip-asn-lite.mmdb
    volumes:
      - ../rules:/app/rules:ro
      - ./geoip:/geoip:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Adds GeoIP context to stored alerts (consumes alerts.new). Optional: needs the databases from
  # `deploy/fetch-geoip.sh`; start it with `docker compose --profile enrichment up -d` (or set
  # COMPOSE_PROFILES=enrichment and SENTINEL_ENRICHMENT_ENABLED=true in deploy/.env). It refuses to
  # start without a readable database rather than run and enrich nothing.
  enricher:
    profiles: ["enrichment"]
    build: *app-build
    command: ["python", "-m", "sentinel_core.workers.enricher"]
    environment:
      <<: *database-url
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_ENRICHMENT_ENABLED: "true"
      SENTINEL_GEOIP_CITY_DB: /geoip/dbip-city-lite.mmdb
      SENTINEL_GEOIP_ASN_DB: /geoip/dbip-asn-lite.mmdb
      # Optional reputation. Unlike GeoIP it SENDS public source addresses to abuseipdb.com.
      # Empty (default) = off. Free plan: 1000 requests a day; the budget below stays under it.
      SENTINEL_ABUSEIPDB_API_KEY: ${SENTINEL_ABUSEIPDB_API_KEY:-}
      SENTINEL_ABUSEIPDB_DAILY_LIMIT: ${SENTINEL_ABUSEIPDB_DAILY_LIMIT:-900}
    volumes:
      - ./geoip:/geoip:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Decides which source addresses would be blocked (consumes alerts.respond). DRY RUN only: it
  # records "would block" and the audit trail, and touches no firewall. Optional: start it with
  # `docker compose --profile response up -d` and set SENTINEL_RESPONDER_ENABLED=true in deploy/.env
  # (the detector only announces alerts to it when that is true). It refuses to start in `enforce`.
  responder:
    profiles: ["response"]
    build: *app-build
    command: ["python", "-m", "sentinel_core.workers.responder"]
    environment:
      <<: *database-url
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_RESPONDER_ENABLED: "true"
      SENTINEL_RESPONDER_MODE: ${SENTINEL_RESPONDER_MODE:-dry_run}
      SENTINEL_RESPONDER_BLOCK_RULES: ${SENTINEL_RESPONDER_BLOCK_RULES:-ssh-bruteforce,ssh-user-enumeration,ssh-invalid-user-flood,ssh-slow-scan}
      SENTINEL_RESPONDER_MIN_SEVERITY: ${SENTINEL_RESPONDER_MIN_SEVERITY:-40}
      SENTINEL_RESPONDER_TTL_SECONDS: ${SENTINEL_RESPONDER_TTL_SECONDS:-3600}
      SENTINEL_RESPONDER_MAX_BLOCKS_PER_MINUTE: ${SENTINEL_RESPONDER_MAX_BLOCKS_PER_MINUTE:-10}
      SENTINEL_RESPONDER_ALLOWLIST: ${SENTINEL_RESPONDER_ALLOWLIST:-}
      SENTINEL_DISCORD_WEBHOOK_URL: ${SENTINEL_DISCORD_WEBHOOK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Announces (log, and Discord when SENTINEL_DISCORD_WEBHOOK_URL is set) an agent that stopped
  # sending its heartbeat, and again when it is back. Always on: it is tiny, and a dead agent
  # otherwise makes detection blind without any error anywhere.
  watchdog:
    build: *app-build
    command: ["python", "-m", "sentinel_core.workers.watchdog"]
    environment:
      <<: *database-url
      SENTINEL_WATCHDOG_SILENCE_SECONDS: ${SENTINEL_WATCHDOG_SILENCE_SECONDS:-300}
      SENTINEL_DISCORD_WEBHOOK_URL: ${SENTINEL_DISCORD_WEBHOOK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: *app-build
    environment:
      <<: *database-url
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_RESPONDER_MODE: ${SENTINEL_RESPONDER_MODE:-dry_run}
      # Dashboard sessions. Secure=true by default (cookie only sent over HTTPS); set to false
      # only for a plain-HTTP lab (see docs/OPERATIONS.md), never for a network-reachable deployment.
      SENTINEL_SESSION_COOKIE_SECURE: ${SENTINEL_SESSION_COOKIE_SECURE:-true}
      SENTINEL_SESSION_TTL_HOURS: ${SENTINEL_SESSION_TTL_HOURS:-8}
      SENTINEL_MFA_ENCRYPTION_KEY: ${SENTINEL_MFA_ENCRYPTION_KEY:-}
      SENTINEL_AUTH_WINDOW_SECONDS: ${SENTINEL_AUTH_WINDOW_SECONDS:-300}
      SENTINEL_AUTH_ACCOUNT_ATTEMPTS: ${SENTINEL_AUTH_ACCOUNT_ATTEMPTS:-10}
      SENTINEL_AUTH_IP_ATTEMPTS: ${SENTINEL_AUTH_IP_ATTEMPTS:-50}
    ports:
      - "${SENTINEL_BIND_ADDR:-127.0.0.1}:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

# Postgres and Redis are intentionally NOT published on the host:
# only the API is reachable from the lab network.
volumes:
  pgdata:
  redisdata:
