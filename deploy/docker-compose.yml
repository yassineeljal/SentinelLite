name: sentinellite

x-app-build: &app-build
  context: ..
  dockerfile: deploy/Dockerfile

x-database-url: &database-url
  SENTINEL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot job: applies database migrations, then exits. The API waits for it.
  migrate:
    build: *app-build
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Consumes events.raw, normalizes, writes events / dead letters. Scale with
  # `docker compose up -d --scale normalizer=N` (consumer group: each entry goes to one worker).
  normalizer:
    build: *app-build
    command: ["python", "-m", "sentinel_core.workers.normalizer"]
    environment:
      <<: *database-url
      SENTINEL_REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: *app-build
    environment:
      <<: *database-url
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_RESPONDER_MODE: ${SENTINEL_RESPONDER_MODE:-dry_run}
    ports:
      - "${SENTINEL_BIND_ADDR:-127.0.0.1}:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

# Postgres and Redis are intentionally NOT published on the host:
# only the API is reachable from the lab network.
volumes:
  pgdata:
  redisdata:
