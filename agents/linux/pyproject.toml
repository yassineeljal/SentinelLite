[project]
name = "sentinel-agent"
version = "0.1.0"
description = "SentinelLite Linux log agent: tails log files and ships them to the ingestion API"
readme = "README.md"
requires-python = ">=3.11"
# No runtime dependency on purpose: the agent is copied to lab VMs and must only need Python.
dependencies = []

[project.scripts]
sentinel-agent = "sentinel_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_agent"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
